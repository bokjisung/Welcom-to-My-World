<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9f2227" />
    <meta
      name="description"
      content="커피 가배의 발주품 사진, 수량, 가격을 직접 기록하고 관리하는 발주 페이지"
    />
    <title>가배 발주 관리</title>
    <style>
:root {
  color-scheme: light;
  --ink: #161414;
  --muted: #746e6e;
  --paper: #ffffff;
  --canvas: #f4f3f1;
  --line: #dedad6;
  --line-strong: #c7c1bc;
  --red: #9f2227;
  --red-dark: #741519;
  --red-soft: #f7e9e9;
  --shadow: 0 18px 50px rgba(35, 24, 20, 0.08);
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 11px;
  font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", Inter, system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--canvas);
}

body {
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(90deg, transparent 0 78px, rgba(159, 34, 39, 0.08) 78px 79px, transparent 79px),
    var(--canvas);
}

button,
input,
select {
  font: inherit;
}

button,
select,
input[type="date"],
.photo-picker {
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
}

.app-shell {
  width: min(1220px, calc(100% - 48px));
  margin: 32px auto;
  padding: 30px 34px 20px;
  background: var(--paper);
  border: 1px solid rgba(22, 20, 20, 0.08);
  border-radius: 28px;
  box-shadow: var(--shadow);
}

.brand-header {
  display: grid;
  grid-template-columns: 112px 1fr auto;
  align-items: center;
  gap: 24px;
  min-height: 120px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--line);
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 112px;
  height: 112px;
  overflow: hidden;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 22px;
}

.brand-mark img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 9px;
}

.brand-copy h1,
.section-heading h2,
.summary-intro h2 {
  margin: 0;
  letter-spacing: -0.04em;
}

.brand-copy h1 {
  margin-top: 4px;
  font-size: clamp(2rem, 4vw, 3.2rem);
  font-weight: 760;
  line-height: 1.08;
}

.brand-copy > p:last-child {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 1rem;
}

.eyebrow,
.summary-kicker {
  margin: 0;
  color: var(--red);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.13em;
}

.date-field {
  display: grid;
  gap: 8px;
  min-width: 190px;
}

.date-field span,
.field > span {
  color: #4d4846;
  font-size: 0.84rem;
  font-weight: 700;
}

.date-field input,
.field input,
.field select {
  width: 100%;
  min-height: 48px;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}

.date-field input {
  padding: 0 14px;
  font-weight: 650;
}

.date-field input:focus,
.field input:focus,
.field select:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(159, 34, 39, 0.11);
}

.summary {
  display: grid;
  grid-template-columns: 1fr minmax(500px, 1.15fr);
  gap: 34px;
  align-items: center;
  margin: 26px 0 44px;
  padding: 26px 28px;
  color: white;
  background:
    radial-gradient(circle at 90% 20%, rgba(255, 255, 255, 0.13), transparent 30%),
    linear-gradient(135deg, #201c1c, #0e0d0d 72%);
  border-radius: var(--radius-lg);
}

.summary-intro,
.section-heading {
  display: flex;
  align-items: center;
  gap: 16px;
}

.section-index {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  color: #fff;
  background: var(--red);
  border-radius: 50%;
  font-size: 0.8rem;
  font-weight: 800;
}

.summary-intro h2 {
  margin-top: 5px;
  font-size: 1.45rem;
}

.summary-metrics {
  display: grid;
  grid-template-columns: 0.8fr 0.9fr 1.45fr;
  margin: 0;
}

.summary-metrics > div {
  min-width: 0;
  padding: 3px 22px;
  border-left: 1px solid rgba(255, 255, 255, 0.16);
}

.summary-metrics dt {
  margin-bottom: 7px;
  color: rgba(255, 255, 255, 0.62);
  font-size: 0.82rem;
}

.summary-metrics dd {
  display: flex;
  align-items: baseline;
  gap: 5px;
  margin: 0;
}

.summary-metrics strong {
  overflow: hidden;
  font-size: clamp(1.45rem, 2.4vw, 2.1rem);
  line-height: 1;
  text-overflow: ellipsis;
}

.summary-metrics span {
  color: rgba(255, 255, 255, 0.72);
  font-size: 0.88rem;
}

.total-metric strong {
  color: #f3bfc1;
}

.section-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 20px;
}

.section-heading h2 {
  margin-top: 4px;
  font-size: 1.7rem;
}

.toolbar-actions {
  display: flex;
  gap: 9px;
}

.button {
  min-height: 46px;
  padding: 0 18px;
  border-radius: 999px;
  font-weight: 750;
  transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
}

.button:active {
  transform: translateY(1px);
}

.button.primary {
  color: #fff;
  background: var(--red);
  border: 1px solid var(--red);
}

.button.primary:hover {
  background: var(--red-dark);
  border-color: var(--red-dark);
}

.button.secondary {
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line-strong);
}

.button.secondary:hover {
  border-color: var(--ink);
}

.button.save {
  color: #fff;
  background: #1d1a19;
  border: 1px solid #1d1a19;
}

.button.save:hover {
  background: #3a3431;
  border-color: #3a3431;
}

.button.save.is-dirty {
  box-shadow: 0 0 0 3px rgba(159, 34, 39, 0.14);
}

.button.save:disabled {
  cursor: wait;
  opacity: 0.68;
}

.view-tabs {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 0 0 28px;
  padding: 7px;
  background: #eeeae6;
  border: 1px solid var(--line);
  border-radius: 16px;
}

.view-tab {
  min-height: 48px;
  padding: 0 14px;
  color: #736b66;
  background: transparent;
  border: 0;
  border-radius: 11px;
  font-size: 0.93rem;
  font-weight: 800;
  transition: color 150ms ease, background 150ms ease, box-shadow 150ms ease;
}

.view-tab:hover {
  color: var(--ink);
  background: rgba(255, 255, 255, 0.58);
}

.view-tab.active {
  color: var(--red);
  background: #fff;
  box-shadow: 0 6px 16px rgba(45, 32, 27, 0.08);
}

.view-panel[hidden] {
  display: none !important;
}

.panel-guide {
  margin: -7px 0 18px 58px;
  color: var(--muted);
  font-size: 0.87rem;
  line-height: 1.65;
}

.order-list {
  display: grid;
  gap: 14px;
}

.order-card {
  position: relative;
  display: grid;
  grid-template-columns: 54px 190px minmax(0, 1fr) 170px 48px;
  gap: 22px;
  align-items: center;
  padding: 18px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  transition: border-color 160ms ease, box-shadow 160ms ease;
}

.order-card:hover,
.order-card:focus-within {
  border-color: #beb6b1;
  box-shadow: 0 12px 28px rgba(38, 27, 23, 0.07);
}

.card-sequence {
  align-self: stretch;
  display: grid;
  place-items: center;
  color: var(--red);
  border-right: 1px solid var(--line);
  font-family: Georgia, serif;
  font-size: 1.35rem;
  font-weight: 700;
}

.photo-picker {
  position: relative;
  display: grid;
  place-items: center;
  width: 190px;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background:
    linear-gradient(135deg, rgba(159, 34, 39, 0.04), transparent 55%),
    #f4f2ef;
  border: 1px dashed #bab2ad;
  border-radius: 14px;
  cursor: pointer;
}

.photo-picker:hover,
.photo-picker:focus-within {
  border-color: var(--red);
}

.photo-input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.photo-placeholder {
  display: grid;
  place-items: center;
  gap: 3px;
  color: #524d4a;
  text-align: center;
}

.photo-placeholder strong {
  margin-top: 3px;
  font-size: 0.9rem;
}

.photo-placeholder small {
  color: #8c8580;
  font-size: 0.75rem;
}

.photo-plus {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  color: #fff;
  background: var(--red);
  border-radius: 50%;
  font-size: 1.35rem;
  font-weight: 300;
  line-height: 1;
}

.photo-preview {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  padding: 6px;
  background: #fff;
  object-fit: contain;
  object-position: center;
}

.photo-preview[hidden] {
  display: none;
}

.photo-change {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 5px 9px;
  color: #fff;
  background: rgba(16, 14, 14, 0.76);
  border-radius: 999px;
  font-size: 0.73rem;
  font-weight: 700;
  backdrop-filter: blur(8px);
}

.item-fields {
  display: grid;
  grid-template-columns: minmax(190px, 1.35fr) minmax(140px, 0.9fr);
  gap: 14px 16px;
}

.field {
  display: grid;
  gap: 7px;
  min-width: 0;
}

.field > span small {
  margin-left: 3px;
  color: #99918c;
  font-size: 0.72rem;
  font-weight: 600;
}

.field input,
.field select {
  padding: 0 13px;
  font-size: 0.95rem;
}

.field input::placeholder {
  color: #aaa29d;
}

.field-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 9px;
}

.quantity-control {
  display: grid;
  grid-template-columns: 40px 1fr 40px;
  min-width: 0;
  min-height: 48px;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
}

.quantity-control:focus-within {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(159, 34, 39, 0.11);
}

.quantity-control button {
  color: #5b5552;
  background: #f5f3f1;
  border: 0;
  font-size: 1.18rem;
}

.quantity-control button:hover {
  color: var(--red);
  background: var(--red-soft);
}

.quantity-control input {
  min-width: 0;
  min-height: 46px;
  padding: 0 4px;
  border: 0;
  border-radius: 0;
  text-align: center;
  appearance: textfield;
}

.quantity-control input:focus {
  box-shadow: none;
}

.quantity-control input::-webkit-inner-spin-button,
.quantity-control input::-webkit-outer-spin-button {
  appearance: none;
  margin: 0;
}

.money-input {
  position: relative;
}

.money-input input {
  padding-right: 38px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.money-input span {
  position: absolute;
  top: 50%;
  right: 13px;
  color: #77706c;
  font-size: 0.85rem;
  transform: translateY(-50%);
  pointer-events: none;
}

.card-total {
  display: grid;
  gap: 8px;
  align-content: center;
  align-self: stretch;
  padding: 18px;
  background: #f7f5f3;
  border-radius: 13px;
}

.card-total > span {
  color: var(--muted);
  font-size: 0.79rem;
  font-weight: 700;
}

.card-total strong {
  color: var(--red);
  font-size: 1.25rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.04em;
  overflow-wrap: anywhere;
}

.delete-button {
  align-self: start;
  width: 44px;
  height: 34px;
  padding: 0;
  color: #8a827e;
  background: transparent;
  border: 0;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 700;
}

.delete-button:hover {
  color: var(--red);
  background: var(--red-soft);
}

.empty-add {
  width: 100%;
  min-height: 240px;
  color: #5b5552;
  background: #faf9f8;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-md);
}

.empty-add span,
.empty-add strong,
.empty-add small {
  display: block;
}

.empty-add span {
  color: var(--red);
  font-size: 2.2rem;
}

.empty-add strong {
  margin-top: 6px;
  font-size: 1.04rem;
}

.empty-add small {
  margin-top: 7px;
  color: var(--muted);
}

.site-list {
  display: grid;
  gap: 12px;
}

.site-card {
  display: grid;
  grid-template-columns: 54px minmax(160px, 0.8fr) minmax(260px, 1.4fr) 130px 48px;
  gap: 14px;
  align-items: end;
  padding: 17px 18px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  transition: border-color 160ms ease, box-shadow 160ms ease;
}

.site-card:hover,
.site-card:focus-within {
  border-color: #beb6b1;
  box-shadow: 0 12px 28px rgba(38, 27, 23, 0.07);
}

.site-sequence {
  align-self: stretch;
  display: grid;
  place-items: center;
  color: var(--red);
  border-right: 1px solid var(--line);
  font-family: Georgia, serif;
  font-size: 1.25rem;
  font-weight: 700;
}

.open-site-button {
  width: 100%;
  min-height: 48px;
  color: #fff;
  background: var(--ink);
  border: 0;
  border-radius: var(--radius-sm);
  font-weight: 800;
}

.open-site-button:hover {
  background: var(--red);
}

.report-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}

.report-card {
  padding: 22px;
  border-radius: var(--radius-md);
}

.report-card {
  background: #fff;
  border: 1px solid var(--line);
}

.report-card label {
  display: block;
  margin-bottom: 10px;
  color: var(--ink);
  font-size: 0.83rem;
  font-weight: 800;
}

.report-card textarea {
  width: 100%;
  min-height: 310px;
  padding: 16px;
  resize: vertical;
  color: #3f3936;
  background: #f8f6f4;
  border: 1px solid var(--line-strong);
  border-radius: 13px;
  font: inherit;
  font-size: 0.91rem;
  line-height: 1.7;
}

.report-card textarea:focus {
  outline: none;
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(159, 34, 39, 0.11);
}

.report-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 9px;
  margin-top: 13px;
}

.page-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-top: 24px;
  padding: 18px 2px 0;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.84rem;
}

.page-footer p {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
}

.save-dot {
  width: 8px;
  height: 8px;
  background: var(--red);
  border-radius: 50%;
  box-shadow: 0 0 0 4px var(--red-soft);
}

.page-footer button {
  padding: 8px 10px;
  color: #8d8580;
  background: transparent;
  border: 0;
  border-radius: 8px;
  font-size: 0.8rem;
}

.page-footer button:hover {
  color: var(--red);
  background: var(--red-soft);
}

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 20;
  padding: 13px 17px;
  color: #fff;
  background: #1d1a19;
  border-radius: 12px;
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.24);
  font-size: 0.9rem;
  font-weight: 650;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: opacity 180ms ease, transform 180ms ease;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

@media (max-width: 1050px) {
  .summary {
    grid-template-columns: 1fr;
  }

  .summary-metrics > div:first-child {
    border-left: 0;
  }

  .order-card {
    grid-template-columns: 42px 160px minmax(0, 1fr) 145px 42px;
    gap: 14px;
  }

  .photo-picker {
    width: 160px;
  }

  .item-fields {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 780px) {
  body {
    background: var(--canvas);
  }

  .app-shell {
    width: 100%;
    min-height: 100vh;
    margin: 0;
    padding: 20px 16px 18px;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }

  .brand-header {
    grid-template-columns: 82px 1fr;
    gap: 14px;
    min-height: auto;
    padding-bottom: 22px;
  }

  .brand-mark {
    width: 82px;
    height: 82px;
    border-radius: 17px;
  }

  .brand-copy h1 {
    font-size: 2rem;
  }

  .brand-copy > p:last-child {
    display: none;
  }

  .eyebrow {
    font-size: 0.64rem;
    letter-spacing: 0.08em;
  }

  .date-field {
    grid-column: 1 / -1;
    min-width: 0;
  }

  .summary {
    gap: 22px;
    margin: 18px 0 34px;
    padding: 22px 18px;
    border-radius: 19px;
  }

  .summary-metrics > div {
    padding: 2px 13px;
  }

  .summary-metrics dt {
    font-size: 0.73rem;
  }

  .summary-metrics strong {
    font-size: clamp(1.25rem, 5vw, 1.65rem);
  }

  .summary-metrics span {
    font-size: 0.73rem;
  }

  .section-toolbar {
    align-items: flex-end;
  }

  .toolbar-actions .secondary {
    display: none;
  }

  .button {
    min-height: 44px;
    padding: 0 14px;
    font-size: 0.9rem;
  }

  .order-card {
    grid-template-columns: 30px minmax(0, 1fr) 42px;
    gap: 14px;
    padding: 14px;
  }

  .view-tabs {
    gap: 5px;
    margin-bottom: 22px;
    padding: 5px;
  }

  .view-tab {
    min-height: 44px;
    padding: 0 7px;
    font-size: 0.78rem;
  }

  .panel-guide {
    margin: -5px 0 16px;
  }

  .site-card {
    grid-template-columns: 30px minmax(0, 1fr) 42px;
    gap: 12px;
    align-items: center;
    padding: 14px;
  }

  .site-sequence {
    grid-row: 1 / 4;
  }

  .site-card .field,
  .open-site-button {
    grid-column: 2 / 3;
  }

  .site-card .delete-button {
    grid-column: 3;
    grid-row: 1;
  }

  .report-layout {
    grid-template-columns: 1fr;
  }

  .report-card {
    padding: 18px;
  }

  .report-card textarea {
    min-height: 280px;
  }

  .report-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .card-sequence {
    grid-row: 1 / 4;
    font-size: 1.05rem;
  }

  .photo-column,
  .item-fields,
  .card-total {
    grid-column: 2 / 3;
  }

  .photo-picker {
    width: 100%;
    max-height: 240px;
  }

  .item-fields {
    grid-template-columns: 1fr;
  }

  .delete-button {
    grid-column: 3;
    grid-row: 1;
  }

  .card-total {
    min-height: 76px;
  }

  .page-footer {
    align-items: flex-start;
  }
}

@media (max-width: 430px) {
  .section-index {
    width: 36px;
    height: 36px;
  }

  .summary-intro h2,
  .section-heading h2 {
    font-size: 1.3rem;
  }

  .summary-metrics {
    grid-template-columns: 0.72fr 0.85fr 1.43fr;
  }

  .summary-metrics > div {
    padding: 0 9px;
  }

  .summary-metrics > div:first-child {
    padding-left: 0;
  }

  .summary-metrics strong {
    font-size: 1.22rem;
  }

  .toolbar-actions {
    flex: 0 0 auto;
  }

  .order-card {
    grid-template-columns: 24px minmax(0, 1fr) 38px;
    padding: 12px;
  }

  .field-row {
    grid-template-columns: 1.35fr 1fr;
  }

  .page-footer p {
    max-width: 215px;
  }
}

@media print {
  @page {
    size: A4 portrait;
    margin: 10mm;
  }

  body {
    background: #fff;
  }

  .app-shell {
    width: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    box-shadow: none;
  }

  .brand-header {
    grid-template-columns: 86px 1fr 170px;
    min-height: 92px;
    padding-bottom: 16px;
  }

  .brand-mark {
    width: 80px;
    height: 80px;
  }

  .brand-copy h1 {
    font-size: 2rem;
  }

  .summary {
    margin: 14px 0 22px;
    padding: 16px 20px;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .section-toolbar {
    margin-bottom: 12px;
  }

  .toolbar-actions,
  .delete-button,
  .photo-change,
  .view-tabs,
  .open-site-button,
  .report-actions,
  .page-footer,
  .toast {
    display: none !important;
  }

  .order-card {
    break-inside: avoid;
    grid-template-columns: 38px 120px minmax(0, 1fr) 140px;
    gap: 12px;
    padding: 10px;
    box-shadow: none !important;
  }

  .photo-picker {
    width: 120px;
  }

  .item-fields {
    grid-template-columns: 1.2fr 0.8fr;
    gap: 8px;
  }

  .field input,
  .field select,
  .quantity-control {
    min-height: 38px;
  }

  .quantity-control input {
    min-height: 36px;
  }

  .quantity-control button {
    display: none;
  }

  .quantity-control {
    grid-template-columns: 1fr;
  }

  .field > span {
    font-size: 0.7rem;
  }

  .card-total {
    padding: 12px;
  }
}

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>
(() => {
  "use strict";

  const API_URL = "/api/state";
  const DRAFT_KEY = "gabae-order-book-server-draft-v2";
  const state = {
    orderDate: "",
    items: [],
    sites: [],
  };

  const elements = {
    orderDate: document.querySelector("#order-date"),
    itemCount: document.querySelector("#item-count"),
    quantityTotal: document.querySelector("#quantity-total"),
    grandTotal: document.querySelector("#grand-total"),
    orderList: document.querySelector("#order-list"),
    itemTemplate: document.querySelector("#item-template"),
    addButton: document.querySelector("#add-button"),
    emptyAddButton: document.querySelector("#empty-add-button"),
    printButton: document.querySelector("#print-button"),
    saveButton: document.querySelector("#save-button"),
    resetButton: document.querySelector("#reset-button"),
    serverStatus: document.querySelector("#server-status"),
    viewTabs: [...document.querySelectorAll(".view-tab")],
    viewPanels: [...document.querySelectorAll(".view-panel")],
    siteList: document.querySelector("#site-list"),
    siteTemplate: document.querySelector("#site-template"),
    addSiteButton: document.querySelector("#add-site-button"),
    reportText: document.querySelector("#report-text"),
    copyReportButton: document.querySelector("#copy-report-button"),
    shareReportButton: document.querySelector("#share-report-button"),
    toast: document.querySelector("#toast"),
  };

  let toastTimer;
  let draftTimer;
  let serverVersion = 0;
  let dirty = false;
  let saving = false;

  function makeId() {
    if (window.crypto?.randomUUID) return window.crypto.randomUUID();
    return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function todayString() {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60_000;
    return new Date(now.getTime() - offset).toISOString().slice(0, 10);
  }

  function newItem() {
    return {
      id: makeId(),
      name: "",
      quantity: 1,
      unit: "개",
      price: 0,
      note: "",
      image: "",
    };
  }

  function newSite(name = "", url = "") {
    return { id: makeId(), name, url };
  }

  function normalizeState(raw) {
    const next = raw && typeof raw === "object" ? raw : {};
    return {
      orderDate: next.orderDate || todayString(),
      items: Array.isArray(next.items)
        ? next.items.map((item) => ({ ...newItem(), ...item }))
        : [newItem()],
      sites: Array.isArray(next.sites)
        ? next.sites.map((site) => ({ ...newSite(), ...site }))
        : [newSite("쿠팡", "coupang.com")],
    };
  }

  function applyState(raw) {
    const next = normalizeState(raw);
    state.orderDate = next.orderDate;
    state.items = next.items;
    state.sites = next.sites;
  }

  function toNumber(value) {
    const digits = String(value ?? "").replace(/[^0-9]/g, "");
    return Number(digits) || 0;
  }

  function formatNumber(value) {
    return Math.max(0, Number(value) || 0).toLocaleString("ko-KR");
  }

  function showToast(message) {
    window.clearTimeout(toastTimer);
    elements.toast.textContent = message;
    elements.toast.classList.add("show");
    toastTimer = window.setTimeout(() => elements.toast.classList.remove("show"), 2200);
  }

  function updateSaveUi() {
    if (saving) {
      elements.saveButton.disabled = true;
      elements.saveButton.textContent = "저장 중...";
      elements.serverStatus.textContent = "서버에 저장하는 중입니다.";
      return;
    }
    elements.saveButton.disabled = false;
    elements.saveButton.classList.toggle("is-dirty", dirty);
    elements.saveButton.textContent = dirty ? "저장하기 · 변경됨" : "저장하기";
    elements.serverStatus.textContent = dirty
      ? "저장되지 않은 변경 내용이 있습니다."
      : "서버에 저장되어 다른 접속자와 공유됩니다.";
  }

  function saveDraftLocally() {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify({ state, serverVersion }));
    } catch (error) {
      // 서버 저장이 기본이며, 로컬 임시 저장 실패는 무시합니다.
    }
  }

  function markDirty() {
    dirty = true;
    updateSaveUi();
    window.clearTimeout(draftTimer);
    draftTimer = window.setTimeout(saveDraftLocally, 250);
  }

  async function saveState(options = {}) {
    if (saving) return false;
    saving = true;
    updateSaveUi();
    try {
      const response = await fetch(API_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ version: serverVersion, state }),
      });

      const data = await response.json().catch(() => ({}));
      if (response.status === 409) {
        const latestVersion = Number(data.version) || serverVersion;
        const overwrite = window.confirm(
          "다른 사용자가 먼저 저장한 최신 내용이 있습니다.\n\n확인: 내가 입력한 내용으로 덮어쓰기\n취소: 다른 사용자의 최신 내용 불러오기",
        );
        if (!overwrite) {
          applyState(data.state);
          serverVersion = latestVersion;
          dirty = false;
          elements.orderDate.value = state.orderDate;
          renderItems();
          renderSites();
          saveDraftLocally();
          showToast("다른 사용자의 최신 내용을 불러왔습니다.");
          return false;
        }

        const retryResponse = await fetch(API_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ version: latestVersion, state }),
        });
        const retryData = await retryResponse.json().catch(() => ({}));
        if (!retryResponse.ok) throw new Error(retryData.error || "retry-save-failed");
        serverVersion = Number(retryData.version) || latestVersion;
        dirty = false;
        saveDraftLocally();
        if (!options.silent) showToast("내 내용으로 서버에 저장했습니다.");
        return true;
      }
      if (!response.ok) throw new Error(data.error || "save-failed");

      serverVersion = Number(data.version) || serverVersion;
      dirty = false;
      saveDraftLocally();
      if (!options.silent) showToast("서버에 저장했습니다.");
      return true;
    } catch (error) {
      dirty = true;
      showToast("서버 저장에 실패했습니다. 서버 실행 상태를 확인해주세요.");
      return false;
    } finally {
      saving = false;
      updateSaveUi();
    }
  }

  async function loadState() {
    try {
      const response = await fetch(API_URL, { cache: "no-store" });
      if (!response.ok) throw new Error("load-failed");
      const data = await response.json();
      applyState(data.state);
      serverVersion = Number(data.version) || 0;
      dirty = false;
      saveDraftLocally();
      return;
    } catch (error) {
      try {
        const draft = JSON.parse(localStorage.getItem(DRAFT_KEY));
        if (draft?.state) {
          applyState(draft.state);
          serverVersion = Number(draft.serverVersion) || 0;
          dirty = true;
          showToast("서버에 연결하지 못해 이 기기의 임시 자료를 열었습니다.");
          return;
        }
      } catch (draftError) {
        localStorage.removeItem(DRAFT_KEY);
      }
      applyState({});
      dirty = true;
      showToast("서버에 연결하지 못했습니다.");
    }
  }

  async function refreshFromServerIfClean() {
    if (dirty || saving || document.hidden) return;
    try {
      const response = await fetch(API_URL, { cache: "no-store" });
      if (!response.ok) return;
      const data = await response.json();
      const nextVersion = Number(data.version) || 0;
      if (nextVersion > serverVersion) {
        applyState(data.state);
        serverVersion = nextVersion;
        elements.orderDate.value = state.orderDate;
        renderItems();
        renderSites();
        showToast("다른 사용자가 저장한 최신 내용을 불러왔습니다.");
      }
    } catch (error) {
      // 다음 주기에 다시 확인합니다.
    }
  }

  function updateSummary() {
    const totalQuantity = state.items.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
    const grandTotal = state.items.reduce(
      (sum, item) => sum + (Number(item.quantity) || 0) * (Number(item.price) || 0),
      0,
    );
    elements.itemCount.textContent = formatNumber(state.items.length);
    elements.quantityTotal.textContent = formatNumber(totalQuantity);
    elements.grandTotal.textContent = formatNumber(grandTotal);
    updateReport();
  }

  function buildReportText() {
    const itemLines = state.items
      .filter((item) => item.name.trim())
      .map((item, index) => {
        const subtotal = (Number(item.quantity) || 0) * (Number(item.price) || 0);
        const note = item.note.trim() ? ` | ${item.note.trim()}` : "";
        return `${String(index + 1).padStart(2, "0")}. ${item.name.trim()} | ${formatNumber(item.quantity)}${item.unit} | ${formatNumber(subtotal)}원${note}`;
      });
    const total = state.items.reduce(
      (sum, item) => sum + (Number(item.quantity) || 0) * (Number(item.price) || 0),
      0,
    );
    return [
      "[가배 발주 보고]",
      `발주일: ${state.orderDate || todayString()}`,
      "",
      ...(itemLines.length ? itemLines : ["입력된 발주 품목이 없습니다."]),
      "",
      `총 발주 금액: ${formatNumber(total)}원`,
    ].join("\n");
  }

  function updateReport() {
    if (elements.reportText) elements.reportText.value = buildReportText();
  }

  function normalizeUrl(value) {
    const trimmed = value.trim();
    if (!trimmed) return "";
    const candidate = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
    try {
      const url = new URL(candidate);
      if (!/^https?:$/.test(url.protocol)) return "";
      return url.href;
    } catch (error) {
      return "";
    }
  }

  async function copyText(text) {
    if (navigator.clipboard?.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (error) {}
    }
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.append(textarea);
    textarea.select();
    const copied = document.execCommand("copy");
    textarea.remove();
    return copied;
  }

  function setImage(card, item) {
    const preview = card.querySelector(".photo-preview");
    const placeholder = card.querySelector(".photo-placeholder");
    const changeLabel = card.querySelector(".photo-change");
    if (item.image) {
      preview.src = item.image;
      preview.alt = item.name ? `${item.name} 발주품 사진` : "발주품 사진";
      preview.hidden = false;
      placeholder.hidden = true;
      changeLabel.hidden = false;
    } else {
      preview.removeAttribute("src");
      preview.alt = "";
      preview.hidden = true;
      placeholder.hidden = false;
      changeLabel.hidden = true;
    }
  }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("read-failed"));
      reader.onload = () => {
        const image = new Image();
        image.onerror = () => reject(new Error("image-failed"));
        image.onload = () => {
          const maxSize = 1280;
          const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
          const width = Math.max(1, Math.round(image.width * scale));
          const height = Math.max(1, Math.round(image.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext("2d");
          if (!context) {
            reject(new Error("canvas-failed"));
            return;
          }
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, width, height);
          context.drawImage(image, 0, 0, width, height);
          canvas.toBlob((blob) => {
            if (!blob) {
              reject(new Error("compress-failed"));
              return;
            }
            resolve(blob);
          }, "image/jpeg", 0.82);
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function makeImageFilename() {
    if (window.crypto?.randomUUID) {
      return `${window.crypto.randomUUID().replaceAll("-", "")}.jpg`;
    }
    const bytes = new Uint8Array(16);
    window.crypto?.getRandomValues?.(bytes);
    let hex = [...bytes].map((value) => value.toString(16).padStart(2, "0")).join("");
    if (!hex || /^0+$/.test(hex)) {
      hex = `${Date.now().toString(16)}${Math.random().toString(16).slice(2)}`.padEnd(32, "0").slice(0, 32);
    }
    return `${hex}.jpg`;
  }

  async function uploadImage(blob) {
    const filename = makeImageFilename();
    const response = await fetch(`/api/images/${filename}`, {
      method: "PUT",
      headers: { "Content-Type": "image/jpeg" },
      body: blob,
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.url) {
      throw new Error(data.error || "image-upload-failed");
    }
    return data.url;
  }

  function updateCardTotal(card, item) {
    const subtotal = (Number(item.quantity) || 0) * (Number(item.price) || 0);
    card.querySelector(".item-subtotal").textContent = formatNumber(subtotal);
  }

  function bindCard(card, item, index) {
    const nameInput = card.querySelector(".item-name");
    const quantityInput = card.querySelector(".item-quantity");
    const unitSelect = card.querySelector(".item-unit");
    const priceInput = card.querySelector(".item-price");
    const noteInput = card.querySelector(".item-note");
    const photoInput = card.querySelector(".photo-input");

    card.dataset.id = item.id;
    card.querySelector(".card-sequence").textContent = String(index + 1).padStart(2, "0");
    nameInput.value = item.name;
    quantityInput.value = item.quantity;
    unitSelect.value = item.unit;
    priceInput.value = item.price ? formatNumber(item.price) : "";
    noteInput.value = item.note;
    setImage(card, item);
    updateCardTotal(card, item);

    nameInput.addEventListener("input", () => {
      item.name = nameInput.value;
      const preview = card.querySelector(".photo-preview");
      if (!preview.hidden) preview.alt = item.name ? `${item.name} 발주품 사진` : "발주품 사진";
      updateReport();
      markDirty();
    });

    quantityInput.addEventListener("input", () => {
      item.quantity = Math.max(0, Number(quantityInput.value) || 0);
      updateCardTotal(card, item);
      updateSummary();
      markDirty();
    });

    card.querySelector(".quantity-minus").addEventListener("click", () => {
      item.quantity = Math.max(0, (Number(item.quantity) || 0) - 1);
      quantityInput.value = item.quantity;
      updateCardTotal(card, item);
      updateSummary();
      markDirty();
    });

    card.querySelector(".quantity-plus").addEventListener("click", () => {
      item.quantity = (Number(item.quantity) || 0) + 1;
      quantityInput.value = item.quantity;
      updateCardTotal(card, item);
      updateSummary();
      markDirty();
    });

    unitSelect.addEventListener("change", () => {
      item.unit = unitSelect.value;
      updateReport();
      markDirty();
    });

    priceInput.addEventListener("input", () => {
      item.price = toNumber(priceInput.value);
      const cursorAtEnd = priceInput.selectionStart === priceInput.value.length;
      priceInput.value = item.price ? formatNumber(item.price) : "";
      if (cursorAtEnd) priceInput.setSelectionRange(priceInput.value.length, priceInput.value.length);
      updateCardTotal(card, item);
      updateSummary();
      markDirty();
    });

    noteInput.addEventListener("input", () => {
      item.note = noteInput.value;
      updateReport();
      markDirty();
    });

    photoInput.addEventListener("change", async () => {
      const [file] = photoInput.files;
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        showToast("이미지 파일만 넣을 수 있습니다.");
        photoInput.value = "";
        return;
      }
      photoInput.disabled = true;
      showToast("사진을 최적화해서 서버에 올리는 중입니다.");
      try {
        const compressed = await compressImage(file);
        item.image = await uploadImage(compressed);
        setImage(card, item);
        markDirty();
        showToast("사진을 올렸습니다. 저장하기를 눌러주세요.");
      } catch (error) {
        showToast("사진 업로드에 실패했습니다. 서버 연결을 확인해주세요.");
      } finally {
        photoInput.disabled = false;
        photoInput.value = "";
      }
    });

    card.querySelector(".delete-button").addEventListener("click", () => {
      state.items = state.items.filter((candidate) => candidate.id !== item.id);
      renderItems();
      markDirty();
      showToast("품목을 삭제했습니다. 저장하기를 눌러주세요.");
    });
  }

  function renderItems() {
    elements.orderList.replaceChildren();
    elements.emptyAddButton.hidden = state.items.length !== 0;
    state.items.forEach((item, index) => {
      const fragment = elements.itemTemplate.content.cloneNode(true);
      const card = fragment.querySelector(".order-card");
      bindCard(card, item, index);
      elements.orderList.append(fragment);
    });
    updateSummary();
  }

  function addItem() {
    const item = newItem();
    state.items.push(item);
    renderItems();
    markDirty();
    window.requestAnimationFrame(() => {
      const card = elements.orderList.querySelector(`[data-id="${item.id}"]`);
      card?.scrollIntoView({ behavior: "smooth", block: "center" });
      card?.querySelector(".item-name")?.focus({ preventScroll: true });
    });
  }

  function bindSiteCard(card, site, index) {
    const nameInput = card.querySelector(".site-name");
    const urlInput = card.querySelector(".site-url");
    nameInput.value = site.name;
    urlInput.value = site.url;
    card.dataset.id = site.id;
    card.querySelector(".site-sequence").textContent = String(index + 1).padStart(2, "0");
    nameInput.addEventListener("input", () => { site.name = nameInput.value; markDirty(); });
    urlInput.addEventListener("input", () => { site.url = urlInput.value; markDirty(); });
    card.querySelector(".open-site-button").addEventListener("click", () => {
      const url = normalizeUrl(site.url);
      if (!url) {
        showToast("올바른 도메인이나 주소를 입력해주세요.");
        urlInput.focus();
        return;
      }
      window.open(url, "_blank", "noopener,noreferrer");
    });
    card.querySelector(".delete-site-button").addEventListener("click", () => {
      state.sites = state.sites.filter((candidate) => candidate.id !== site.id);
      renderSites();
      markDirty();
      showToast("사이트를 삭제했습니다. 저장하기를 눌러주세요.");
    });
  }

  function renderSites() {
    elements.siteList.replaceChildren();
    state.sites.forEach((site, index) => {
      const fragment = elements.siteTemplate.content.cloneNode(true);
      const card = fragment.querySelector(".site-card");
      bindSiteCard(card, site, index);
      elements.siteList.append(fragment);
    });
  }

  function addSite() {
    const site = newSite();
    state.sites.push(site);
    renderSites();
    markDirty();
    window.requestAnimationFrame(() => {
      const card = elements.siteList.querySelector(`[data-id="${site.id}"]`);
      card?.scrollIntoView({ behavior: "smooth", block: "center" });
      card?.querySelector(".site-name")?.focus({ preventScroll: true });
    });
  }

  function switchView(view) {
    elements.viewTabs.forEach((tab) => {
      const active = tab.dataset.view === view;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
    });
    elements.viewPanels.forEach((panel) => {
      const active = panel.dataset.viewPanel === view;
      panel.classList.toggle("active", active);
      panel.hidden = !active;
    });
    if (view === "report") updateReport();
  }

  elements.orderDate.addEventListener("change", () => {
    state.orderDate = elements.orderDate.value;
    updateReport();
    markDirty();
  });

  elements.addButton.addEventListener("click", addItem);
  elements.emptyAddButton.addEventListener("click", addItem);
  elements.addSiteButton.addEventListener("click", addSite);
  elements.printButton.addEventListener("click", () => window.print());
  elements.saveButton.addEventListener("click", () => saveState());
  elements.viewTabs.forEach((tab) => tab.addEventListener("click", () => switchView(tab.dataset.view)));

  elements.copyReportButton.addEventListener("click", async () => {
    const copied = await copyText(buildReportText());
    showToast(copied ? "보고 문구를 복사했습니다." : "문구를 선택해 직접 복사해주세요.");
  });

  elements.shareReportButton.addEventListener("click", async () => {
    const text = buildReportText();
    if (navigator.share) {
      try {
        await navigator.share({ title: "가배 발주 보고", text });
        return;
      } catch (error) {
        if (error?.name === "AbortError") return;
      }
    }
    const copied = await copyText(text);
    showToast(copied ? "문구를 복사했어요. 카카오톡에 붙여넣어 주세요." : "문구를 선택해 직접 복사해주세요.");
  });

  elements.resetButton.addEventListener("click", async () => {
    const confirmed = window.confirm("입력한 사진과 발주 내용을 모두 지울까요? 이 작업은 서버의 공용 자료에도 반영됩니다.");
    if (!confirmed) return;
    state.orderDate = todayString();
    state.items = [newItem()];
    state.sites = [newSite("쿠팡", "coupang.com")];
    elements.orderDate.value = state.orderDate;
    renderItems();
    renderSites();
    markDirty();
    await saveState();
  });

  window.addEventListener("beforeunload", (event) => {
    if (!dirty) return;
    event.preventDefault();
    event.returnValue = "";
  });

  async function initialize() {
    await loadState();
    elements.orderDate.value = state.orderDate;
    renderItems();
    renderSites();
    switchView("orders");
    updateSaveUi();
    window.setInterval(refreshFromServerIfClean, 10000);
  }

  initialize();
})();
</script>
  </body>
</html>
