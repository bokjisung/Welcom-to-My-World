<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to HJS!</title>
  <script>
    (function(){
      try{
        var t = localStorage.getItem('hjs_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      }catch(e){}
    })();
  </script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap");

    :root {
      --bg: #1b1b1e;
      --tx0: #e4e5e8; --tx1: #86868d; --tx2: #45454b;
      --ac: #5b9bd5; --ac-light: #7fb3e0; --ac-dim: rgba(91,155,213,0.09); --ac-mid: #4a86bb; --ac-rgb: 91,155,213;
      --mono: 'JetBrains Mono','Fira Code',monospace;
      --sans: 'Inter',-apple-system,sans-serif;
      --err: #e0716f; --err-rgb: 224,113,111;
      --sh-d: rgba(0,0,0,0.62);
      --sh-d-soft: rgba(0,0,0,0.4);
      --sh-l: rgba(255,255,255,0.035);
      --sh-l-soft: rgba(255,255,255,0.02);
      --hairline: rgba(255,255,255,0.06);
      --sheen: rgba(255,255,255,0.08);
    }

    html[data-theme="light"] {
      --bg: #e9ebf0;
      --tx0: #2d2f36; --tx1: #6e7178; --tx2: #a4a7b0;
      --ac: #4a86bb; --ac-light: #5b9bd5; --ac-dim: rgba(74,134,187,0.10); --ac-mid: #3c6f96; --ac-rgb: 74,134,187;
      --err: #c94b4b; --err-rgb: 201,75,75;
      --sh-d: rgba(163,177,198,0.55);
      --sh-d-soft: rgba(163,177,198,0.4);
      --sh-l: rgba(255,255,255,0.9);
      --sh-l-soft: rgba(255,255,255,0.7);
      --hairline: rgba(0,0,0,0.08);
      --sheen: rgba(255,255,255,0.6);
    }
    html[data-theme="pink"] {
      --bg: #f5e8ec;
      --tx0: #4a2f38; --tx1: #8a6670; --tx2: #c3a4ad;
      --ac: #c9668a; --ac-light: #d883a1; --ac-dim: rgba(201,102,138,0.12); --ac-mid: #a84f70; --ac-rgb: 201,102,138;
      --err: #c2504f; --err-rgb: 194,80,79;
      --sh-d: rgba(198,157,171,0.5);
      --sh-d-soft: rgba(198,157,171,0.36);
      --sh-l: rgba(255,255,255,0.9);
      --sh-l-soft: rgba(255,255,255,0.7);
      --hairline: rgba(0,0,0,0.08);
      --sheen: rgba(255,255,255,0.6);
    }
    html[data-theme="blue"] {
      --bg: #e5eef8;
      --tx0: #243447; --tx1: #5b7186; --tx2: #9fb2c4;
      --ac: #3f7fc4; --ac-light: #5b9bd5; --ac-dim: rgba(63,127,196,0.12); --ac-mid: #2f6396; --ac-rgb: 63,127,196;
      --err: #c25454; --err-rgb: 194,84,84;
      --sh-d: rgba(160,180,206,0.5);
      --sh-d-soft: rgba(160,180,206,0.36);
      --sh-l: rgba(255,255,255,0.9);
      --sh-l-soft: rgba(255,255,255,0.7);
      --hairline: rgba(0,0,0,0.08);
      --sheen: rgba(255,255,255,0.6);
    }

    *, ::before, ::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }

    body {
      height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg);
      overflow: hidden; font-family: var(--sans); user-select: none; position: relative;
    }

    #bg-video {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: -1; opacity: 0;
    }

    .cursor-light {
      position: fixed; width: 280px; height: 280px; border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(var(--ac-rgb),0.05) 0%, transparent 70%);
      transform: translate(-50%,-50%); z-index: 2; mix-blend-mode: screen;
      opacity: 0; transition: opacity 0.4s;
    }

    .flash {
      position: fixed; inset: 0;
      background: radial-gradient(circle, rgba(var(--ac-rgb),0.18), transparent 65%);
      opacity: 0; pointer-events: none; z-index: 100;
    }

    .main-title {
      font-family: var(--mono); font-size: 54px; font-weight: 700;
      letter-spacing: 16px; color: var(--tx0);
      text-align: center; line-height: 1; margin-bottom: 48px;
      position: relative; z-index: 3;
      text-shadow: 2px 2px 4px var(--sh-d-soft);
      animation: titleIn 0.9s cubic-bezier(0.16,1,0.3,1) 0s 1 normal both running;
      transition: margin-bottom 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .main-title.compact { margin-bottom: 22px; }
    .main-title .hjs-text {
      display: block; font-family: var(--mono); font-size: 32px; font-weight: 300;
      letter-spacing: 10px; color: var(--tx2); margin-top: 7px;
    }
    @keyframes titleIn {
      0%   { opacity: 0; transform: translateY(-18px); }
      100% { opacity: 1; transform: translateY(0px); }
    }

    /* ── LOGIN BOX (neumorphic raised surface) ── */
    .login-box {
      width: 364px; padding: 38px 32px;
      position: relative; z-index: 3; text-align: center; border-radius: 28px;
      background: var(--bg);
      box-shadow:
        14px 14px 30px var(--sh-d),
        -14px -14px 30px var(--sh-l);
      animation: boxIn 1s cubic-bezier(0.16,1,0.3,1) 0.12s 1 normal both running;
      overflow: hidden;
      max-height: 420px;
      transition: max-height 0.55s cubic-bezier(0.16,1,0.3,1),
                  opacity 0.7s, transform 0.7s, box-shadow 0.4s;
    }
    .login-box.expanded { max-height: 700px; }
    .login-box.success {
      opacity: 0; transform: translateY(-18px) scale(0.95);
    }
    @keyframes boxIn {
      0%   { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0px); }
    }

    /* ── 헤더 (타이틀 + 닫기) ── */
    .box-header {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 26px;
    }
    .login-title {
      font-family: var(--mono); font-size: 10px; font-weight: 500;
      letter-spacing: 4px; text-transform: uppercase; color: var(--tx2);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      flex: 1;
    }
    .login-title::before, .login-title::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--hairline), transparent);
    }

    .close-signup {
      display: none;
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px;
      border: none; border-radius: 50%;
      background: var(--bg);
      box-shadow: 4px 4px 8px var(--sh-d-soft), -4px -4px 8px var(--sh-l);
      color: var(--tx1); font-size: 12px; line-height: 1;
      cursor: pointer;
      align-items: center; justify-content: center;
      transition: box-shadow 0.2s, color 0.2s;
      z-index: 5;
    }
    .close-signup:hover {
      color: var(--ac-light);
      box-shadow: 2px 2px 5px var(--sh-d-soft), -2px -2px 5px var(--sh-l);
    }
    .expanded .close-signup { display: flex; }

    /* ── INPUTS (neumorphic pressed-in) ── */
    .login-box input {
      width: 100%; padding: 12px 14px; margin-bottom: 12px;
      border-radius: 12px; border: none;
      background: var(--bg); color: var(--tx0);
      outline: none; font-family: var(--mono); font-size: 13px; letter-spacing: 1px;
      box-shadow: inset 5px 5px 10px var(--sh-d-soft), inset -5px -5px 10px var(--sh-l);
      transition: box-shadow 0.2s;
    }
    .login-box input::placeholder { color: var(--tx2); font-family: var(--sans); letter-spacing: 0px; font-size: 12px; }
    .login-box input:focus {
      box-shadow: inset 5px 5px 10px var(--sh-d-soft), inset -5px -5px 10px var(--sh-l), 0 0 0 1.5px var(--ac-dim);
    }
    .login-box input.input-error {
      box-shadow: inset 5px 5px 10px var(--sh-d-soft), inset -5px -5px 10px var(--sh-l), 0 0 0 1.5px rgba(var(--err-rgb),0.4) !important;
    }

    /* ── 회원가입 확장 영역 ── */
    .signup-fields {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.45s cubic-bezier(0.16,1,0.3,1) 0.05s,
                  opacity 0.35s ease 0.1s;
    }
    .expanded .signup-fields { max-height: 300px; opacity: 1; }

    .divider {
      display: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--hairline), transparent);
      margin: 10px 0 14px;
    }
    .expanded .divider { display: block; }

    /* 인라인 에러 메시지 */
    .field-err {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.3px;
      color: var(--err); text-align: left; padding: 0 2px;
      margin-top: -6px; margin-bottom: 6px; min-height: 14px;
      opacity: 0; transition: opacity 0.2s;
    }
    .field-err.show { opacity: 1; }

    /* ── BUTTONS (raised neumorphic) ── */
    .gold-btn {
      width: 100%; padding: 13px; margin-top: 6px; border: none; border-radius: 14px;
      font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 4px;
      cursor: pointer; color: var(--ac-light);
      background: var(--bg);
      box-shadow: 6px 6px 14px var(--sh-d), -6px -6px 14px var(--sh-l);
      position: relative; overflow: hidden;
      transition: box-shadow 0.15s, color 0.15s, transform 0.12s;
    }
    .gold-btn:hover {
      color: var(--ac-mid);
      box-shadow: 4px 4px 10px var(--sh-d), -4px -4px 10px var(--sh-l), 0 0 16px var(--ac-dim);
    }
    .gold-btn:active {
      box-shadow: inset 5px 5px 10px var(--sh-d-soft), inset -5px -5px 10px var(--sh-l);
    }
    .gold-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .gold-btn::before {
      content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(120deg, transparent, var(--sheen), transparent);
      transition: 0.5s;
    }
    .gold-btn:hover::before { left: 100%; }

    .guest-btn {
      width: 100%; padding: 12px; margin-top: 8px;
      border: none; border-radius: 14px;
      font-family: var(--mono); font-size: 12px; font-weight: 400; letter-spacing: 2px;
      cursor: pointer; background: var(--bg); color: var(--tx1);
      box-shadow: 5px 5px 10px var(--sh-d-soft), -5px -5px 10px var(--sh-l-soft);
      transition: box-shadow 0.2s, color 0.2s;
    }
    .guest-btn:hover { color: var(--ac-light); box-shadow: 3px 3px 7px var(--sh-d-soft), -3px -3px 7px var(--sh-l-soft); }
    .guest-btn:active { box-shadow: inset 4px 4px 8px var(--sh-d-soft), inset -4px -4px 8px var(--sh-l-soft); }

    .signup-link { margin-top: 14px; font-size: 10px; text-align: center; color: var(--tx2); }
    .signup-link a {
      color: var(--tx1); text-decoration: none; cursor: pointer;
      font-family: var(--mono); letter-spacing: 1px; transition: color 0.2s;
    }
    .signup-link a:hover { color: var(--ac-light); }

    .to-login {
      display: none;
      margin-top: 14px; font-size: 10px; text-align: center; color: var(--tx2);
    }
    .to-login a { color: var(--tx1); text-decoration: none; cursor: pointer; font-family: var(--mono); letter-spacing: 1px; transition: color 0.2s; }
    .to-login a:hover { color: var(--ac-light); }
    .expanded .to-login { display: block; }
    .expanded .signup-link { display: none; }

    #message { margin-top: 12px; font-size: 12px; font-weight: 500; min-height: 18px; font-family: var(--mono); letter-spacing: 0.5px; }

    /* ── 테마 스위처 (뉴모피즘) ── */
    .theme-switcher {
      position: fixed; top: 22px; right: 22px; z-index: 50;
      display: flex; gap: 10px; padding: 10px;
      border-radius: 20px; background: var(--bg);
      box-shadow: 6px 6px 14px var(--sh-d), -6px -6px 14px var(--sh-l);
    }
    .theme-btn {
      width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer;
      padding: 0; position: relative;
      box-shadow: 4px 4px 8px var(--sh-d-soft), -4px -4px 8px var(--sh-l);
      transition: box-shadow 0.25s ease, transform 0.15s ease;
    }
    .theme-btn:hover { transform: translateY(-1px); }
    .theme-btn.active {
      box-shadow: inset 3px 3px 6px var(--sh-d-soft), inset -3px -3px 6px var(--sh-l);
    }
    .theme-btn.active::after {
      content: ""; position: absolute; inset: -4px; border-radius: 50%;
      border: 1.5px solid var(--ac); opacity: 0.7;
    }
    .theme-btn[data-theme-btn="dark"]  { background: #1b1b1e; }
    .theme-btn[data-theme-btn="light"] { background: #e9ebf0; }
    .theme-btn[data-theme-btn="pink"]  { background: #f5e8ec; }
    .theme-btn[data-theme-btn="blue"]  { background: #e5eef8; }
    @media (max-width: 480px) {
      .theme-switcher { top: 12px; right: 12px; padding: 8px; gap: 8px; }
      .theme-btn { width: 22px; height: 22px; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
      .main-title { font-size: 40px; letter-spacing: 11px; margin-bottom: 36px; }
      .main-title .hjs-text { font-size: 26px; letter-spacing: 7px; }
      .main-title.compact { margin-bottom: 18px; }
      .login-box { width: min(84vw, 330px); padding: 26px 22px; }
    }
    @media (max-width: 480px) {
      .main-title { font-size: 30px; letter-spacing: 7px; margin-bottom: 28px; }
      .main-title .hjs-text { font-size: 20px; letter-spacing: 5px; }
      .main-title.compact { margin-bottom: 14px; }
      .login-box { width: 88vw; padding: 20px 16px; border-radius: 22px; box-shadow: 10px 10px 22px var(--sh-d), -10px -10px 22px var(--sh-l); }
      .login-box input { padding: 10px 12px; font-size: 12px; margin-bottom: 9px; }
      .gold-btn, .guest-btn { padding: 10px; font-size: 11px; }
      .signup-link, .to-login { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

<div class="theme-switcher" id="themeSwitcher" role="group" aria-label="테마 선택">
  <button type="button" class="theme-btn" data-theme-btn="dark"  title="다크"></button>
  <button type="button" class="theme-btn" data-theme-btn="light" title="라이트"></button>
  <button type="button" class="theme-btn" data-theme-btn="pink"  title="핑크"></button>
  <button type="button" class="theme-btn" data-theme-btn="blue"  title="블루"></button>
</div>

<video autoplay muted loop id="bg-video">
  <source src="https://cdn.coverr.co/videos/coverr-golden-light-particles-1574/1080p.mp4" type="video/mp4">
</video>

<h1 class="main-title" id="mainTitle">HJS<span class="hjs-text"></span></h1>

<div class="login-box" id="loginBox">

  <div class="box-header">
    <h2 class="login-title" id="boxTitle">Login</h2>
    <button class="close-signup" id="closeSignup" title="닫기">✕</button>
  </div>

  <form id="loginForm" autocomplete="off">
    <input type="text"     id="username" placeholder="Username" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">

    <!-- 회원가입 확장 영역 -->
    <div class="signup-fields" id="signupFields">
      <div class="divider"></div>

      <input type="text"  id="nickname" placeholder="닉네임 (**필수**)" autocomplete="off" maxlength="20">
      <div class="field-err" id="err-nickname"></div>

      <input type="email" id="email" placeholder="이메일 (**선택**)" autocomplete="off">
      <div class="field-err" id="err-email"></div>
    </div>

    <button type="submit" class="gold-btn" id="mainBtn">ENTER</button>
    <button type="button" class="guest-btn" id="guestBtn">비회원</button>

    <div class="signup-link">
      <a id="openSignupBtn">회원가입</a>
    </div>
    <div class="to-login">
      <a id="toLoginBtn">이미 계정이 있으신가요? 로그인</a>
    </div>
  </form>

  <p id="message"></p>
</div>

<div class="cursor-light"></div>
<div class="flash"></div>
<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<script>
/* ── DOM ── */
const loginBox      = document.getElementById('loginBox');
const mainTitle     = document.getElementById('mainTitle');
const boxTitle      = document.getElementById('boxTitle');
const mainBtn       = document.getElementById('mainBtn');
const guestBtn      = document.getElementById('guestBtn');
const openSignupBtn = document.getElementById('openSignupBtn');
const toLoginBtn    = document.getElementById('toLoginBtn');
const closeSignup   = document.getElementById('closeSignup');
const msg           = document.getElementById('message');
const flash         = document.querySelector('.flash');
const cursorLight   = document.querySelector('.cursor-light');
const clickSound    = document.getElementById('clickSound');

const fUsername = document.getElementById('username');
const fPassword = document.getElementById('password');
const fNickname = document.getElementById('nickname');
const fEmail    = document.getElementById('email');
const errNickname = document.getElementById('err-nickname');
const errEmail    = document.getElementById('err-email');

let isSignupMode = false;

/* ── 유틸 ── */
function setMsg(text, color='#e05b5b') { msg.textContent = text; msg.style.color = color; }
function clearMsg() { msg.textContent = ''; }

function showFieldErr(el, text) { el.textContent = text; el.classList.add('show'); }
function clearFieldErr(el)      { el.textContent = ''; el.classList.remove('show'); }
function clearAllErrors() {
  clearFieldErr(errNickname);
  clearFieldErr(errEmail);
  [fUsername, fPassword, fNickname, fEmail].forEach(i => i.classList.remove('input-error'));
  clearMsg();
}

function isValidEmail(v) {
  return /^[^\s@]+@[^\s@]+\.(com|net|org|co\.kr|kr|io|dev|me|info|biz|edu|gov|ac\.kr)$/.test(v);
}

/* ── 모드 전환 ── */
function enterSignupMode() {
  isSignupMode = true;
  loginBox.classList.add('expanded');
  mainTitle.classList.add('compact');
  boxTitle.textContent = 'Register';
  mainBtn.textContent  = 'CREATE';
  guestBtn.style.display = 'none';
  fNickname.value = ''; fEmail.value = '';
  clearAllErrors();
  setTimeout(() => fNickname.focus(), 300);
}
function exitSignupMode() {
  isSignupMode = false;
  loginBox.classList.remove('expanded');
  mainTitle.classList.remove('compact');
  boxTitle.textContent = 'Login';
  mainBtn.textContent  = 'ENTER';
  guestBtn.style.display = '';
  clearAllErrors();
}

openSignupBtn.addEventListener('click', enterSignupMode);
toLoginBtn.addEventListener('click',   exitSignupMode);
closeSignup.addEventListener('click',  exitSignupMode);

/* ── 실시간 유효성 검사 ── */
fNickname.addEventListener('input', () => {
  const v = fNickname.value.trim();
  if (v.length > 0 && v.length < 2) {
    showFieldErr(errNickname, '닉네임은 2자 이상이어야 합니다.');
    fNickname.classList.add('input-error');
  } else {
    clearFieldErr(errNickname);
    fNickname.classList.remove('input-error');
  }
});

fEmail.addEventListener('input', () => {
  const v = fEmail.value.trim();
  if (v.length > 0 && !isValidEmail(v)) {
    showFieldErr(errEmail, '알맞은 이메일형식(@, .com, .net...)이 아닙니다.');
    fEmail.classList.add('input-error');
  } else {
    clearFieldErr(errEmail);
    fEmail.classList.remove('input-error');
  }
});

/* ── 커서 라이트 ── */
document.addEventListener('mousemove', e => {
  cursorLight.style.left    = e.clientX + 'px';
  cursorLight.style.top     = e.clientY + 'px';
  cursorLight.style.opacity = '1';
});
document.addEventListener('mouseleave', () => cursorLight.style.opacity = '0');

/* ── 성공 애니메이션 ── */
function playSuccessAnim() {
  try { clickSound.currentTime = 0; clickSound.play(); } catch(_) {}
  flash.style.transition = 'none'; flash.style.opacity = '1';
  setTimeout(() => { flash.style.transition = 'opacity 0.6s'; flash.style.opacity = '0'; }, 50);
}

/* ── 폼 제출 ── */
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  clearAllErrors();
  if (isSignupMode) { await doRegister(); }
  else              { await doLogin(); }
});

/* ── 로그인 ── */
async function doLogin() {
  const username = fUsername.value.trim();
  const password = fPassword.value;
  if (!username || !password) { setMsg('아이디와 비밀번호를 입력하세요.'); return; }

  mainBtn.disabled = true; mainBtn.textContent = '...';

  try {
    const res  = await fetch('https://welcom-to-my-world-production.up.railway.app/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();

    if (data.success) {
      localStorage.setItem('hjs_token',    data.token);
      localStorage.setItem('hjs_username', data.user.username);
      localStorage.setItem('hjs_role',     data.user.role);
      setMsg('환영합니다!', 'var(--ac-light)');
      playSuccessAnim();
      alert("환영합니다!");
      setTimeout(() => {
        loginBox.classList.add('success');
        setTimeout(() => { window.location.href = 'frontend/welcome.html'; }, 300);
      }, 600);
    } else {
      setMsg(data.message || '아이디 또는 비밀번호가 틀렸습니다.');
      mainBtn.disabled = false; mainBtn.textContent = 'ENTER';
    }
  } catch(_) {
    setMsg('서버에 연결할 수 없습니다.');
    mainBtn.disabled = false; mainBtn.textContent = 'ENTER';
  }
}

/* ── 회원가입 ── */
async function doRegister() {
  const username = fUsername.value.trim();
  const password = fPassword.value;
  const nickname = fNickname.value.trim();
  const email    = fEmail.value.trim();

  let hasErr = false;
  if (!username) { fUsername.classList.add('input-error'); setMsg('아이디를 입력하세요.'); hasErr = true; }
  if (!password || password.length < 8) { fPassword.classList.add('input-error'); setMsg('비밀번호는 8자 이상이어야 합니다.'); hasErr = true; }
  if (!nickname || nickname.length < 2) {
    showFieldErr(errNickname, '닉네임은 2자 이상 입력해야 합니다.');
    fNickname.classList.add('input-error'); hasErr = true;
  }
  if (email && !isValidEmail(email)) {
    showFieldErr(errEmail, '알맞은 이메일형식(@, .com, .net...)이 아닙니다.');
    fEmail.classList.add('input-error'); hasErr = true;
  }
  if (hasErr) return;

  mainBtn.disabled = true; mainBtn.textContent = '...';

  try {
    const res  = await fetch('https://welcom-to-my-world-production.up.railway.app/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, nickname, email: email || null }),
    });
    const data = await res.json();

    if (data.success) {
      setMsg('가입 완료! 로그인해주세요.', 'var(--ac-light)');
      mainBtn.disabled = false; mainBtn.textContent = 'CREATE';
      setTimeout(() => exitSignupMode(), 1400);
    } else {
      const m = data.message || '';
      if (m.includes('닉네임')) {
        showFieldErr(errNickname, m);
        fNickname.classList.add('input-error');
      } else if (m.includes('이메일')) {
        showFieldErr(errEmail, m);
        fEmail.classList.add('input-error');
      } else if (m.includes('아이디')) {
        fUsername.classList.add('input-error');
        setMsg(m);
      } else {
        setMsg(m);
      }
      mainBtn.disabled = false; mainBtn.textContent = 'CREATE';
    }
  } catch(_) {
    setMsg('서버에 연결할 수 없습니다.');
    mainBtn.disabled = false; mainBtn.textContent = 'CREATE';
  }
}

/* ── 테마 스위처 ── */
(function(){
  var THEMES = ['dark','light','pink','blue'];
  function currentTheme(){
    return document.documentElement.getAttribute('data-theme') || 'dark';
  }
  function setActiveBtn(theme){
    document.querySelectorAll('.theme-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-theme-btn') === theme);
    });
  }
  document.querySelectorAll('.theme-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var t = btn.getAttribute('data-theme-btn');
      if (THEMES.indexOf(t) === -1) return;
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('hjs_theme', t); } catch(e){}
      setActiveBtn(t);
    });
  });
  setActiveBtn(currentTheme());
})();
</script>
